name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: sportakip-debug-keystore-v1
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Signing fingerprint
        run: |
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:' > signing-fingerprint.txt
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SporTakip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SporTakip-APK
          path: |
            SporTakip.apk
            signing-fingerprint.txt
